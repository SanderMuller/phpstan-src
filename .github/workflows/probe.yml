name: probe

on:
  push:
    branches: [tiny-run-bench]
    paths: [probe/**, .github/workflows/probe.yml]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer
      - run: (cd bench/project && composer install -q --no-interaction)
      - name: Inside PHPStan, stock / timestamps off / timestamps on
        run: |
          PKG=bench/project/vendor/phpstan/phpstan
          mkdir -p "$RUNNER_TEMP/fc0" "$RUNNER_TEMP/fcv"
          for arm in stock fc0 fcv; do cp -R $PKG "$RUNNER_TEMP/arm-$arm"; done
          php -d phar.readonly=0 bench/make-arm.php "$RUNNER_TEMP/arm-fc0/phpstan.phar" sha512 "$RUNNER_TEMP/fc0"
          php -d phar.readonly=0 bench/make-arm.php "$RUNNER_TEMP/arm-fcv/phpstan.phar" sha512 "$RUNNER_TEMP/fcv" vts
          cd probe/proj
          for arm in stock fc0 fcv; do for run in 1 2; do
            echo "== $arm run $run"
            php "$RUNNER_TEMP/arm-$arm/phpstan.phar" analyse -c phpstan.neon --debug --no-progress 2>&1 | grep PROBE || true
          done; done
          find "$RUNNER_TEMP/fcv" -name '*.bin' | wc -l
