name: tiny-run-bench

on:
  push:
    branches: [tiny-run-bench]
    paths-ignore: [sig/**, probe/**, .github/workflows/sig-bench.yml, .github/workflows/probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer
      - name: Install and build arms
        run: |
          set -e
          W="$RUNNER_TEMP/w"
          (cd bench/project && composer install -q --no-interaction)
          (cd bench/tools && composer install -q --no-interaction)
          php bench/project/vendor/phpstan/phpstan/phpstan.phar --version
          git clone -q --depth 1 https://github.com/nikic/PHP-Parser "$RUNNER_TEMP/php-parser"
          php bench/setup.php "$W" bench/project/vendor/phpstan/phpstan stock pr pre prci
          if [ "$RUNNER_OS" = Linux ]; then
            git clone -q --depth 1 https://github.com/tempestphp/tempest-framework "$RUNNER_TEMP/tempest"
            (cd "$RUNNER_TEMP/tempest" && composer install -q --no-interaction --ignore-platform-reqs --no-scripts)
            php bench/prepare.php "$W" "$RUNNER_TEMP/php-parser/lib" "$RUNNER_TEMP/tempest"
          else
            php bench/prepare.php "$W" "$RUNNER_TEMP/php-parser/lib"
          fi
          php bench/setup.php "$W" bench/project/vendor/phpstan/phpstan --neon-only
          cd "$W/projects/tiny"
          env -u CI -u GITHUB_ACTIONS php "$W/arms/pr/phpstan.phar" diagnose | grep -E 'Turbo extension|trusted|Mechanism'
          php "$W/arms/prci/phpstan.phar" diagnose | grep -E 'Turbo extension|trusted|Mechanism'
      - name: Tiny project
        env:
          ARMS: stock,pr,pre,prci
        run: php bench/suite.php "$RUNNER_TEMP/w" tiny 12
      - name: php-parser lib (271 files)
        env:
          ARMS: stock,pr,pre,prci
        run: php bench/suite.php "$RUNNER_TEMP/w" parser 7
      - name: php-parser lib, spawned workers
        env:
          ARMS: stock,pr,pre
        run: php bench/suite.php "$RUNNER_TEMP/w" spawn 7
      - name: Tempest (full)
        if: runner.os == 'Linux'
        env:
          ARMS: stock,pr,pre
        run: php bench/suite.php "$RUNNER_TEMP/w" tempest 3
      - name: Same errors as stock
        run: |
          set +e
          for p in parser tempest; do
            [ -d "$RUNNER_TEMP/w/projects/$p" ] || continue
            cd "$RUNNER_TEMP/w/projects/$p"
            rm -rf tmp-stock tmp-pr
            php "$RUNNER_TEMP/w/arms/stock/phpstan.phar" analyse -c phpstan-stock.neon --no-progress --error-format=raw --memory-limit=-1 2>/dev/null | sort > stock.txt
            env -u CI -u GITHUB_ACTIONS php "$RUNNER_TEMP/w/arms/pr/phpstan.phar" analyse -c phpstan-pr.neon --no-progress --error-format=raw --memory-limit=-1 2>/dev/null | sort > pr.txt
            echo "$p: $(wc -l < stock.txt) stock lines, $(wc -l < pr.txt) pr lines"
            diff -q stock.txt pr.txt && echo "$p: identical"
          done
      - name: The pull request's cache directory
        run: |
          D="$(php -r 'echo sys_get_temp_dir();')/phpstan-opcache-$(id -u)"
          ls -la "$D"
          for k in "$D"/*/; do echo "$k $(find "$k" -name '*.bin' | wc -l) entries $(du -sh "$k" | cut -f1)"; done
