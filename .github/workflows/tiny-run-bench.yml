name: tiny-run-bench

on:
  push:
    branches: [tiny-run-bench]
    paths-ignore: [sig/**, probe/**, .github/workflows/sig-bench.yml, .github/workflows/probe.yml, .github/workflows/tiny-run-bench.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer
      - name: Environment
        run: |
          php -v
          php -r 'foreach (["opcache.enable_cli", "opcache.file_cache", "opcache.jit", "disable_functions"] as $k) echo $k, "=", var_export(ini_get($k), true), "\n"; echo "pcntl_fork: ", var_export(function_exists("pcntl_fork"), true), "\n";'
      - name: Install and build arms
        run: |
          set -e
          W="$RUNNER_TEMP/w"
          (cd bench/project && composer install -q --no-interaction)
          git clone -q --depth 1 https://github.com/nikic/PHP-Parser "$RUNNER_TEMP/php-parser"
          php bench/setup.php "$W" bench/project/vendor/phpstan/phpstan stock fc0 fcv fcve conc
          if [ "$RUNNER_OS" = Linux ]; then
            git clone -q --depth 1 https://github.com/tempestphp/tempest-framework "$RUNNER_TEMP/tempest"
            (cd "$RUNNER_TEMP/tempest" && composer install -q --no-interaction --ignore-platform-reqs --no-scripts)
            php bench/prepare.php "$W" "$RUNNER_TEMP/php-parser/lib" "$RUNNER_TEMP/tempest"
          else
            php bench/prepare.php "$W" "$RUNNER_TEMP/php-parser/lib"
          fi
          php bench/setup.php "$W" bench/project/vendor/phpstan/phpstan --neon-only
          cd "$W/projects/tiny" && php "$W/arms/fcv/phpstan.phar" diagnose | grep -E 'Turbo extension|Mechanism|Reason'
      - name: Tiny project
        run: php bench/suite.php "$RUNNER_TEMP/w" tiny 7
      - name: Cache contents after the tiny suite
        run: php bench/probe.php "$RUNNER_TEMP/w"
      - name: php-parser lib (271 files)
        run: php bench/suite.php "$RUNNER_TEMP/w" parser 5
      - name: php-parser lib, spawned workers
        run: php bench/suite.php "$RUNNER_TEMP/w" spawn 5
      - name: Tempest (full)
        if: runner.os == 'Linux'
        run: php bench/suite.php "$RUNNER_TEMP/w" tempest 3
      - name: Cache contents at the end
        run: php bench/probe.php "$RUNNER_TEMP/w"
